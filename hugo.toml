baseurl      = "https://titouanrenard.eu"
title = "Titouan Renard"
theme = 'lyapunov-dark'
## Enable Git information for pages, (e.g. lastMod date information)
enableGitInfo = false
## Convert all URLs to absolute URLs
canonifyURLs = false
relativeURLs = false
## Default language for content
defaultContentLanguage = 'en'
## Put default language in subdirectory
defaultContentLanguageInSubdir = false
## Generate a robots.txt
enableRobotsTXT = true
## Files to ignore when building site
ignoreFiles = [ '\.redacted', '\.old','\.bak', '\.tmp', '\.swp', '\.DS_Store']

## Main menu
## weight must be negative: Hugo 0.160 treats weight 0 as "unweighted" and sorts it last
[[menu.main]]
    weight = -1
    identifier = "home"
    name = "Home"
    pageRef = "/"

[[menu.main]]
    weight = 1
    identifier = "about"
    name = "CV"
    pageRef = "about"

[[menu.main]]
    weight = 2
    identifier = "publications"
    name = "Publications"
    pageRef = "publications"

[[menu.main]]
    weight = 3
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/renarddesneiges/"

[[menu.main.params]]
    target = "_blank"

## markup configuration
[markup]
    [markup.highlight]
        ## Enable code fence highlighting
        codeFences = true
        ## Emit inline styles (no Chroma class stylesheet is shipped)
        noClasses = true
  [markup.goldmark]
    [markup.goldmark.renderer]
        unsafe = true
     [markup.goldmark.extensions]
       [markup.goldmark.extensions.passthrough]
         enable = true
         [markup.goldmark.extensions.passthrough.delimiters]
           block = [['\[', '\]'], ['$$', '$$']]
           inline = [['\(', '\)']]
## Sitemap configuration
[sitemap]
    ## Change frequency setting: 'always', 'hourly', 'daily', 'weekly', 'monthly', 'yearly', 'never'
    changeFreq = 'monthly'

## Taxonomy register
[taxonomies]

## Site parameters
[params]
    ## Site title
    title = "Titouan Renard"
    ## Site description
    description = "Titouan Renard's Website"
    ## Copyright notice in the footer
    copyright = "Copyright 2026 © Titouan Renard"
    ## Do not block AI user agents in robots.txt
    AllowAIRobots = false

    ## Author information
    [params.author]
        name = 'Titouan Renard'
        email = 'titouan.renard@unige.etu.ch'

    ## Favicon configuration
    [params.favicon]
        png = 'images/favicon-96x96.png'
        svg = 'images/favicon.svg'
        ico = 'images/favicon.ico'
        apple = 'images/apple-touch-icon.png'
        appTitle = 'Titouan Renard'
        webmanifest = '/site.webmanifest'

    ## Feed display settings
    [params.RSS]
        limit = 15 # item limit default: 15
        content = 15 # limit item with full content
